<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Masini - abordare "bruta"</title>
    <script>
      // "masina" JS - rămâne neschimbată
      function loadMjs() {
        document.getElementById("mjs").innerHTML =
          "<ul>" +
          "<li>Tip:  Dacia</li>" +
          "<li>Model:  Logan</li>" +
          "<li>Culoare:  verde</li>" +
          "<li>Combustibil:  benzina</li>" +
          "</ul>";
      }

      // --- LOCAL STORAGE ---
      function afiseazaMls() {
        if (localStorage.tip && localStorage.model && localStorage.culoare) {
          document.getElementById("mls").innerHTML =
            "<ul>" +
            "<li>Tip: " +
            localStorage.tip +
            "</li>" +
            "<li>Model: " +
            localStorage.model +
            "</li>" +
            "<li>Culoare: " +
            localStorage.culoare +
            "</li>" +
            "<li>Combustibil: " +
            localStorage.combustibil +
            "</li>" +
            "</ul>";
        } else {
          document.getElementById("mls").innerHTML = "Nicio mașină salvată";
        }
      }

      function salveazaMls() {
        localStorage.tip = document.getElementById("tipL").value;
        localStorage.model = document.getElementById("modelL").value;
        localStorage.culoare = document.getElementById("culoareL").value;
        localStorage.combustibil =
          document.getElementById("combustibilL").value;

        afiseazaMls();
        return false;
      }

      function stergeMls() {
        localStorage.removeItem("tip");
        localStorage.removeItem("model");
        localStorage.removeItem("culoare");
        localStorage.removeItem("combustibil");
        afiseazaMls();
      }

      // --- SESSION STORAGE ---
      function afiseazaMss() {
        if (
          sessionStorage.tip &&
          sessionStorage.model &&
          sessionStorage.culoare
        ) {
          document.getElementById("mss").innerHTML =
            "<ul>" +
            "<li>Tip: " +
            sessionStorage.tip +
            "</li>" +
            "<li>Model: " +
            sessionStorage.model +
            "</li>" +
            "<li>Culoare: " +
            sessionStorage.culoare +
            "</li>" +
            "<li>Combustibil: " +
            sessionStorage.combustibil +
            "</li>" +
            "</ul>";
        } else {
          document.getElementById("mss").innerHTML = "Nicio mașină salvată";
        }
      }

      function salveazaMss() {
        sessionStorage.tip = document.getElementById("tipS").value;
        sessionStorage.model = document.getElementById("modelS").value;
        sessionStorage.culoare = document.getElementById("culoareS").value;
        sessionStorage.combustibil =
          document.getElementById("combustibilS").value;
        afiseazaMss();
        return false;
      }

      function stergeMss() {
        sessionStorage.removeItem("tip");
        sessionStorage.removeItem("model");
        sessionStorage.removeItem("culoare");
        sessionStorage.removeItem("combustibil");
        afiseazaMss();
      }
    </script>
  </head>

  <body
    onload="
      afiseazaMls();
      afiseazaMss();
    "
  >
    <!-- Masina JavaScript (neschimbată) -->
    <div
      style="background-color: LimeGreen; color: white; font-size: 200%"
      onclick="loadMjs()"
    >
      <p>Masina JavaScript</p>
      <div id="mjs"></div>
    </div>

    <!-- Masina Local Storage -->
    <div style="background-color: ForestGreen; color: white; font-size: 200%">
      <p>Masina Local Storage</p>
      <form onsubmit="return salveazaMls();">
        <label for="tipL">Tip</label> <input id="tipL" required />
        <label for="modelL">Model</label> <input id="modelL" required />
        <label for="culoareL">Culoare</label> <input id="culoareL" required />
        <label for="combustibilL">Combustibil</label>
        <input id="combustibilL" required />
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMls()">Șterge</button>
      </form>
      <div id="mls"></div>
    </div>

    <!-- Masina Session Storage -->
    <div style="background-color: SeaGreen; color: white; font-size: 200%">
      <p>Masina Session Storage</p>
      <form onsubmit="return salveazaMss();">
        <label for="tipS">Tip</label> <input id="tipS" required />
        <label for="modelS">Model</label> <input id="modelS" required />
        <label for="culoareS">Culoare</label> <input id="culoareS" required />
        <label for="combustibilS">Combustibil</label>
        <input id="combustibilS" required />
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMss()">Șterge</button>
      </form>
      <div id="mss"></div>
    </div>
    <a href="index.html">Inapoi la Laboratorul 7</a>
  </body>
</html>
