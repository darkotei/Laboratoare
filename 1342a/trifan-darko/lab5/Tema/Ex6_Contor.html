<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Bec cu contor</title>
    <script>
      var stare = 0;
      var contor = 0;

      function schimbaBecul() {
        var bec = document.getElementById("imagineBec");
        var textContor = document.getElementById("textContor");

        if (stare === 0) {
          bec.src = "Bec aprins.gif";
          stare = 1;
          contor = contor + 1;
          textContor.innerHTML = "Becul a fost aprins de " + contor + " ori.";
        } else {
          bec.src = "Bec stins.gif";
          stare = 0;
        }
      }
    </script>
  </head>
  <body>
    <h1>Contorizator click-uri pe imagine</h1>

    <p>
      <img
        id="imagineBec"
        src="Bec stins.gif"
        width="100"
        height="180"
        onclick="schimbaBecul()"
        style="cursor: pointer"
      />
    </p>
    <p id="textContor">Becul a fost aprins de 0 ori.</p>

    <a href="../Tema/">Inapoi la Exercitii de modificat</a>
  </body>
</html>
