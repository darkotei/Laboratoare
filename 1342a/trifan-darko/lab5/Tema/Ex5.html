<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Exercițiul 5</title>
  </head>
  <body>
    <h1>Schimbare fundal la click</h1>

    <script>
      alert("Urmează să se încarce primul paragraf!");
    </script>

    <p onclick="document.body.style.backgroundColor = 'yellow'">
      Acesta este primul paragraf. Apasă pe mine pentru a face fundalul paginii
      galben.
    </p>

    <script>
      alert("Urmează să se încarce al doilea paragraf!");
    </script>

    <p onclick="document.body.style.backgroundColor = 'orange'">
      Acesta este al doilea paragraf. Apasă pe mine pentru a face fundalul
      paginii portocaliu.
    </p>

    <a href="../Tema/">Inapoi la Exercitii de modificat</a>
  </body>
</html>
