<!doctype html>
<html>
  <head>
    <title>Tabel masini</title>
    <style>
      table {
        font-family: arial, sans-serif;
        border-collapse: collapse;
        width: 100%;
      }

      td,
      th {
        border: 1px solid #dddddd;
        text-align: left;
        padding: 8px;
      }
      #mesaj {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Masinile dorite</h1>
    <form onsubmit="return adaugaMasina();">
      <input id="marca" placeholder="Marca" required />
      <input id="model" placeholder="Model" required />
      <input id="culoare" placeholder="Culoare" required />
      <input id="anFab" type="number" placeholder="An fabricatie" />
      <button type="submit">Adauga masina</button>
    </form>
    <p id="mesaj"></p>
    <table id="tm">
      <tr>
        <th>Marca</th>
        <th>Model</th>
        <th>Culoare</th>
        <th>An fabricatie</th>
      </tr>
    </table>
    <script>
      /*
      Explicație Exercițiul 6 (Ce aduce nou L8_C față de L8_B):
      1. Tabloul masini2Store: În L8_B se salva un singur obiect care se suprascria la fiecare adăugare. Aici, masini2Store este un vector (array) în care adăugăm pe rând fiecare mașină nouă cu .push(), păstrând astfel toată istoria adăugărilor.
      2. Cheia carsArray: În loc să salveze un singur obiect sub cheia "masinaN", salvează în localStorage întregul vector masini2Store transformat în șir JSON (o listă de obiecte).
      3. Bucla de la încărcare: La reîncărcarea paginii, dacă există date în localStorage.carsArray, le transformă înapoi în listă cu JSON.parse() și folosește o buclă for pentru a afișa toate mașinile în tabel (în ordinea adăugării) și pentru a le repopula în masini2Store, astfel încât viitoarele adăugări să se adauge peste cele existente, nu să le șteargă.
      */
      const masini2Store = [];
      if (localStorage.carsArray) {
        let arrayJSON = localStorage.carsArray;
        var masiniStored = JSON.parse(arrayJSON);
        for (var i = 0; i < masiniStored.length; i++) {
          document.getElementById("tm").innerHTML += masiniStored[i].randNou; // proprietate
          masini2Store.push(masiniStored[i]);
        }
      }

      function masina(mk, md, cl, an) {
        this.marca = mk;
        this.model = md;
        this.culoare = cl;
        this.anFab = an;
        this.randNou = function () {
          return (
            "<tr><td>" +
            this.marca +
            "</td><td>" +
            this.model +
            "</td><td>" +
            this.culoare +
            "</td><td>" +
            this.anFab +
            "</td></tr>"
          );
        };
      }

      function valideaza(marca, model, culoare, an) {
        if (marca.trim() === "") {
          return "Eroare: Marca nu poate fi goală sau formată doar din spații.";
        }
        if (model.trim() === "") {
          return "Eroare: Modelul nu poate fi gol sau format doar din spații.";
        }
        if (culoare.trim() === "") {
          return "Eroare: Culoarea nu poate fi goală sau formată doar din spații.";
        }

        var anCurent = new Date().getFullYear();
        var anNumar = Number(an);

        if (
          an.trim() === "" ||
          !Number.isInteger(anNumar) ||
          anNumar < 1900 ||
          anNumar > anCurent
        ) {
          return (
            "Eroare: Anul trebuie să fie un număr întreg între 1900 și " +
            anCurent +
            "."
          );
        }

        return "";
      }

      function adaugaMasina() {
        var marca = document.getElementById("marca").value;
        var model = document.getElementById("model").value;
        var culoare = document.getElementById("culoare").value;
        var an = document.getElementById("anFab").value;
        var pMesaj = document.getElementById("mesaj");
        var eroare = valideaza(marca, model, culoare, an);

        if (eroare !== "") {
          pMesaj.innerHTML = eroare;
          return false;
        }

        pMesaj.innerHTML = "";

        var mNoua = new masina(
          marca.trim(),
          model.trim(),
          culoare.trim(),
          Number(an),
        );

        document.getElementById("tm").innerHTML += mNoua.randNou();

        mNoua.randNou = mNoua.randNou().toString();
        masini2Store.push(mNoua);
        var myJSON = JSON.stringify(masini2Store);
        localStorage.setItem("carsArray", myJSON);

        document.getElementById("marca").value = "";
        document.getElementById("model").value = "";
        document.getElementById("culoare").value = "";
        document.getElementById("anFab").value = "";
        return false;
      }
    </script>
    <a href="index.html">Inapoi la Laboratorul 8</a>
  </body>
</html>
