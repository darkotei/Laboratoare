<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS_B1</title>
    <style>
      body {
        background-color: #ffffcc;
      }
      .center {
        text-align: center;
        color: white;
      }
      h1 {
        background-color: #00cc66;
        color: orange;
      }
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      td.centre {
        border: 2px solid blue;
        border-collapse: collapse;
      }
      .centre {
        border: 5px solid blue;
        padding: 15px;
      }
      #s1 {
        background-color: #00cc66;
      }
      #s2 {
        background-color: yellow;
      }
      div {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1 class="center">Tabele formatate</h1>
    <div id="s1">
      <table style="width: 100%; background-color: blue" class="center">
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
          <th>Age</th>
        </tr>
        <tr>
          <td>Jill</td>
          <td>Smith</td>
          <td>50</td>
        </tr>
        <tr>
          <td>Eve</td>
          <td>Jackson</td>
          <td>94</td>
        </tr>
      </table>
      <br />
    </div>
    <div id="s2" style="width: 50%">
      <br />
      <table style="width: 100%" class="centre">
        <tr>
          <th class="centre">Firstname</th>
          <th class="centre">Lastname</th>
          <th class="centre">Age</th>
        </tr>
        <tr>
          <td class="centre">Jill</td>
          <td>Smith</td>
          <td>50</td>
        </tr>
        <tr>
          <td class="centre">Eve</td>
          <td>Jackson</td>
          <td>94</td>
        </tr>
      </table>
    </div>

    <!-- Cele 2 tabele au fundaluri diferite deoarece ambele erau transparente (nu aveau o regula de background-color). Astfel, preia culoarea din "s1" (primul tabel) si din "s2" (al doilea tabel).
     Celulele celui de al doilea tabel arata diferit in zonele unde s-a folosit clasa ".centre"
    -->
  </body>
</html>
