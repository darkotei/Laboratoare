<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS_C1</title>
    <style>
      #hd {
        font-variant: small-caps;
        color: magenta;
      }
      h1 {
        background-color: #cccc00;
      }
      caption {
        color: white;
        background-color: orange;
        font-size: x-large;
      }
      body {
        background-color: #ffffcc;
      }
      .center,
      p {
        text-align: center;
        color: red;
      }

      /* Reguli pentru tabel lizibil*/
      table,
      th,
      td {
        border: 3px solid green;
        border-collapse: collapse;
      }
      th {
        background-color: magenta;
      }
      td {
        background-color: orange;
        padding: 10px;
        text-align: left;
      }
      .echipa {
        background-color: magenta;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1 id="hd">Tabel special</h1>
    <p>Un tabel cu "celule lipite"</p>
    <table style="width: 100%">
      <caption>
        Echipe si hobby-uri
      </caption>
      <tr>
        <th>Echipa</th>
        <th>Nume</th>
        <th colspan="2">Pasiuni</th>
      </tr>
      <tr>
        <td rowspan="3" class="echipa">Munte</td>
        <td>Popescu</td>
        <td>calatorii</td>
        <td>filatelie</td>
      </tr>
      <tr>
        <td>Ionescu</td>
        <td>planorism</td>
        <td>sah</td>
      </tr>
      <tr>
        <td>Vasilescu</td>
        <td>fotbal</td>
        <td>table</td>
      </tr>
      <tr>
        <td rowspan="4" class="echipa">Mare</td>
        <td>Georgescu</td>
        <td>plaja</td>
        <td>dans</td>
      </tr>
      <tr>
        <td>Gigescu</td>
        <td>surf</td>
        <td>samba</td>
      </tr>
      <tr>
        <td>Mintescu</td>
        <td>politica</td>
        <td>delicateturi</td>
      </tr>
      <tr>
        <td>Ion</td>
        <td>handbal</td>
        <td>fotografie</td>
      </tr>
    </table>
  </body>
</html>
