<!DOCTYPE html>
<html>
  <head>
    <title>Tabel masini</title>
    <style>
      table {
        font-family: arial, sans-serif;
        border-collapse: collapse;
        width: 100%;
      }

      td,
      th {
        border: 1px solid #dddddd;
        text-align: left;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Masinile dorite</h1>

    <form onsubmit="return adaugaMasina()">
      <input id="marca" placeholder="Marca" required type="text" />
      <input id="model" placeholder="Model" required type="text" />
      <input id="culoare" placeholder="Culoare" required type="text" />
      <input
        id="anFab"
        type="number"
        placeholder="An fabricatie"
        required
        type="number"
      />
      <button type="submit">Adauga masina</button>
    </form>
    <p id="mesaj"></p>
    <table id="tm">
      <tr>
        <th>Marca</th>
        <th>Model</th>
        <th>Culoare</th>
        <th>An</th>
      </tr>
    </table>
    <script>
      const masini2Store = [];
      if (localStorage.carsArray) {
        let arrayJSON = localStorage.carsArray;
        var masiniStored = JSON.parse(arrayJSON);
        for (i = 0; i < masiniStored.length; i++) {
          document.getElementById("tm").innerHTML += masiniStored[i].randNou; // proprietate
          masini2Store.push(masiniStored[i]);
        }
      }

      function masina(mk, md, cl, an) {
        this.marca = mk;
        this.model = md;
        this.culoare = cl;
        this.anFab = an; // proprietate nouă
        this.randNou = function () {
          return (
            "<tr><td>" +
            this.marca +
            "</td><td>" +
            this.model +
            "</td><td>" +
            this.culoare +
            "</td><td>" +
            this.anFab +
            "</td></tr>"
          );
        };
      }
      function adaugaMasina() {
        var marca = document.getElementById("marca").value; // în loc de prompt("Marca:")
        var model = document.getElementById("model").value;
        var culoare = document.getElementById("culoare").value;
        var an = document.getElementById("anFab").value;
        let eroare = valideaza(marca, model, culoare, an);
        if (eroare !== "") {
          document.getElementById("mesaj").innerText = eroare;
          return false;
        } else {
          document.getElementById("mesaj").innerText = "";
        }
        var mNoua = new masina(marca, model, culoare, an);

        document.getElementById("tm").innerHTML += mNoua.randNou();

        mNoua.randNou = mNoua.randNou().toString();
        masini2Store.push(mNoua);
        var myJSON = JSON.stringify(masini2Store);
        localStorage.setItem("carsArray", myJSON);
        return false;
      }
      function valideaza(marca, model, culoare, an) {
        const anCurent = new Date().getFullYear();

        if (!marca.trim() || !isNaN(marca)) {
          return "Marca nu poate fi goala sau numar!";
        }

        if (!model.trim() || !isNaN(model)) {
          return "Modelul nu poate fi gol sau numar!";
        }

        if (!culoare.trim() || !isNaN(culoare)) {
          return "Culoarea nu poate fi goala sau numar!";
        }

        if (
          an.trim() === "" ||
          !Number.isInteger(Number(an)) ||
          Number(an) < 1900 ||
          Number(an) > anCurent
        ) {
          return `Anul trebuie sa fie intre 1900 si ${anCurent}!`;
        }

        return "";
      }
    </script>
  </body>
  <!--aduce faptul ca acum masinile sunt stocate in array care e stocat in local storage cu cheia carsArray
  bucla for adauga in tabel masina si da push cu masina noua in array ul din local storage-->
</html>
